name: Smart Downloader V5

on:
  workflow_dispatch:
    inputs:
      file_urls:
        description: "لینک‌ها را با فاصله (Space) از هم جدا کنید (حداکثر ۱۰ لینک)"
        required: true

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip p7zip-full

      - name: Prepare folders
        run: |
          mkdir -p downloads
          mkdir -p parts

      - name: Download and process URLs
        env:
          RAW_URLS: ${{ github.event.inputs.file_urls }}
        run: |
          # GitHub به‌طور پیش‌فرض با -e اجرا می‌کند، اینجا برای هندل‌کردن خطاها غیرفعال می‌کنیم
          set +e
          set -u
          set -f  # غیرفعال کردن globbing مثل * برای امنیت بیشتر

          LIMIT=$((100*1024*1024))   # 100MB
          RUN_DIR="run-${{ github.run_id }}"
          mkdir -p "parts/$RUN_DIR"
          mkdir -p downloads

          echo "Input URLs (space-separated):"
          echo "$RAW_URLS"
          echo "----------------------------------------"

          COUNT=0
          FAILED=0

          for URL in $RAW_URLS; do
            if [ -z "$URL" ]; then
              continue
            fi

            COUNT=$((COUNT+1))
            if [ "$COUNT" -gt 10 ]; then
              echo "More than 10 URLs supplied, ignoring the rest."
              break
            fi

            echo "========================================"
            echo "[$(date -u +'%H:%M:%S')] START URL #$COUNT:"
            echo "$URL"

            start_ts=$(date +%s)

            # استخراج نام پایه از URL
            BASENAME=$(basename "${URL%%\?*}")
            if [ -z "$BASENAME" ] || [ "$BASENAME" = "/" ]; then
              BASENAME="file_$COUNT"
            fi

            OUT_PATH="downloads/$BASENAME"

            # اگر فایلی با همین نام وجود داشت، یکتا کن
            if [ -e "$OUT_PATH" ]; then
              TS=$(date +%s)
              OUT_PATH="downloads/${TS}_$BASENAME"
              BASENAME=$(basename "$OUT_PATH")
            fi

            echo "Will download to: $OUT_PATH"

            # دانلود ترتیبی و مقاوم:
            # --max-time 1200   : حداکثر ۲۰ دقیقه برای هر لینک
            # --speed-limit 10k : اگر سرعت کمتر از ۱۰KB/s باشد
            # --speed-time 300  : به مدت ۵ دقیقه، دانلود قطع می‌شود
            if ! curl -L \
                     --retry 5 --retry-delay 5 \
                     --max-time 1200 \
                     --speed-limit 10240 --speed-time 300 \
                     -C - "$URL" -o "$OUT_PATH"; then
              echo "Download FAILED for URL #$COUNT"
              FAILED=1
              rm -f "$OUT_PATH"
              continue
            fi

            SIZE=$(stat -c%s "$OUT_PATH" 2>/dev/null)
            if [ -z "$SIZE" ]; then
              echo "Could not determine size for $OUT_PATH. Skipping."
              FAILED=1
              rm -f "$OUT_PATH"
              continue
            fi

            echo "Downloaded size: $SIZE bytes"

            TARGET_DIR="parts/$RUN_DIR"
            mkdir -p "$TARGET_DIR"

            # برای هر لینک یک نام امن و یکتا
            SAFE_BASE="${COUNT}_$BASENAME"

            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "Large file → splitting into 95MB parts (no compression)"

              OUT_ZIP="$TARGET_DIR/$SAFE_BASE.zip"
              idx=1
              while [ -e "$OUT_ZIP" ]; do
                OUT_ZIP="$TARGET_DIR/${SAFE_BASE}_$idx.zip"
                idx=$((idx+1))
              done

              # -0 یعنی بدون فشرده‌سازی (فقط split) ⇒ خیلی سریع‌تر
              if ! zip -s 95m -0 "$OUT_ZIP" "$OUT_PATH"; then
                echo "zip FAILED for $OUT_PATH. Skipping this file."
                FAILED=1
                rm -f "$OUT_PATH"
                continue
              fi

              rm -f "$OUT_PATH"
            else
              echo "Small file → keeping as a single file"
              TARGET_PATH="$TARGET_DIR/$SAFE_BASE"
              if ! mv "$OUT_PATH" "$TARGET_PATH"; then
                echo "Failed to move $OUT_PATH to $TARGET_PATH. Skipping."
                FAILED=1
                rm -f "$OUT_PATH"
                continue
              fi
            fi

            end_ts=$(date +%s)
            dur=$((end_ts - start_ts))
            echo "[$(date -u +'%H:%M:%S')] DONE URL #$COUNT in ${dur}s"

          done

          echo "========================================"
          echo "Processed $COUNT URL(s). Failures flag: $FAILED"
          echo "Listing files under parts/:"
          find parts -maxdepth 3 -type f -ls || true

      - name: Commit to repo
        id: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add parts

          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "pushed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git commit -m "Downloaded files (run ${{ github.run_id }})"

          if git push; then
            echo "Push succeeded."
            echo "pushed=true" >> $GITHUB_OUTPUT
          else
            echo "Push failed, will use release fallback."
            echo "pushed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release if repo push failed
        if: steps.commit.outputs.pushed != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: download-${{ github.run_id }}
          name: Download ${{ github.run_id }}
          files: |
            parts/**/*
