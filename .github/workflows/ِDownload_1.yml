name: Smart Downloader V3

on:
  workflow_dispatch:
    inputs:
      file_urls:
        description: "لینک‌ها را با فاصله (Space) از هم جدا کنید (حداکثر ۱۰ لینک)"
        required: true

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip p7zip-full

      - name: Prepare folders
        run: |
          mkdir -p downloads
          mkdir -p parts

      - name: Download and process URLs
        # انتقال امن ورودی به متغیر محیطی برای جلوگیری از خطاهای Bash
        env:
          RAW_URLS: ${{ github.event.inputs.file_urls }}
        run: |
          set -u
          set -f # غیرفعال کردن بسط کاراکترهای خاص مثل * برای امنیت بیشتر

          LIMIT=$((100*1024*1024))   # 100MB
          RUN_DIR="run-${{ github.run_id }}"
          mkdir -p "parts/$RUN_DIR"

          echo "Processing URLs for $RUN_DIR"
          COUNT=0

          # در اینجا متغیر RAW_URLS بدون کوتیشن نوشته شده تا Bash خودش 
          # اسپیس‌ها و تب‌ها را به عنوان جداکننده تشخیص دهد.
          for URL in $RAW_URLS; do
            
            # اگر خالی بود رد کن
            if [ -z "$URL" ]; then
              continue
            fi

            COUNT=$((COUNT+1))
            if [ "$COUNT" -gt 10 ]; then
              echo "⚠️ بیش از ۱۰ لینک وارد شده است؛ لینک‌های بعدی نادیده گرفته می‌شوند."
              break
            fi

            echo "----------------------------------------"
            echo "URL #$COUNT: $URL"

            # استخراج اسم فایل از لینک
            BASENAME=$(basename "${URL%%\?*}")
            if [ -z "$BASENAME" ] || [ "$BASENAME" = "/" ]; then
              BASENAME="file_$COUNT"
            fi

            OUT_PATH="downloads/$BASENAME"

            # جلوگیری از تداخل اسم اگر دو فایل هم‌نام بودند
            if [ -e "$OUT_PATH" ]; then
              TS=$(date +%s)
              OUT_PATH="downloads/${TS}_$BASENAME"
              BASENAME=$(basename "$OUT_PATH")
            fi

            echo "Downloading to: $OUT_PATH"

            # دانلود با قابلیت مقاومت در برابر قطعی
            curl -L --retry 10 --retry-delay 5 -C - "$URL" -o "$OUT_PATH"

            # بررسی حجم فایل
            SIZE=$(stat -c%s "$OUT_PATH")
            echo "Size: $SIZE bytes"

            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "Large file → splitting into 95MB parts"
              zip -s 95m "parts/$RUN_DIR/${BASENAME}.zip" "$OUT_PATH"
              rm "$OUT_PATH"
            else
              echo "Small file → keeping as a single file"
              mv "$OUT_PATH" "parts/$RUN_DIR/$BASENAME"
            fi

          done

          echo "All done for $RUN_DIR"
          ls -R parts

      - name: Commit to repo
        id: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add parts

          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "pushed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git commit -m "Downloaded files (run ${{ github.run_id }})"

          if git push; then
            echo "Push succeeded."
            echo "pushed=true" >> $GITHUB_OUTPUT
          else
            echo "Push failed, will use release fallback."
            echo "pushed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release if repo push failed
        if: steps.commit.outputs.pushed != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: download-${{ github.run_id }}
          name: Download ${{ github.run_id }}
          files: |
            parts/**/*
