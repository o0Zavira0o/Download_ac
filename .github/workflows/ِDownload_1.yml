name: Smart Downloader v2

on:
  workflow_dispatch:
    inputs:
      file_urls:
        description: "تا ۱۰ لینک، هر کدام در یک خط"
        required: true

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip p7zip-full

      - name: Prepare folders
        run: |
          mkdir -p downloads
          mkdir -p parts

      - name: Download and process URLs
        run: |
          set -u

          LIMIT=$((100*1024*1024))   # 100MB
          RUN_DIR="run-${{ github.run_id }}"
          mkdir -p "parts/$RUN_DIR"

          echo "Processing URLs for $RUN_DIR"
          COUNT=0

          # خواندن هر خط به عنوان یک URL
          while IFS= read -r URL; do
            # حذف فاصله‌های ابتدا/انتها (زیاد حساس نیست، فقط برای تمیزی)
            URL="$(echo "$URL" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

            # اگر خط خالی بود، رد کن
            if [ -z "$URL" ]; then
              continue
            fi

            COUNT=$((COUNT+1))
            if [ "$COUNT" -gt 10 ]; then
              echo "بیش از ۱۰ لینک داده شده؛ بقیه نادیده گرفته می‌شوند."
              break
            fi

            echo "----------------------------------------"
            echo "URL #$COUNT: $URL"

            # استخراج اسم فایل از URL (بدون query string)
            BASENAME=$(basename "${URL%%\?*}")
            if [ -z "$BASENAME" ] || [ "$BASENAME" = "/" ]; then
              BASENAME="file_$COUNT"
            fi

            OUT_PATH="downloads/$BASENAME"

            # اگر قبلاً فایلی با این اسم وجود داشت، یکتا کن
            if [ -e "$OUT_PATH" ]; then
              TS=$(date +%s)
              OUT_PATH="downloads/${TS}_$BASENAME"
              BASENAME=$(basename "$OUT_PATH")
            fi

            echo "Downloading to: $OUT_PATH"

            # دانلود مقاوم
            curl -L --retry 10 --retry-delay 5 -C - "$URL" -o "$OUT_PATH"

            # چک سایز
            SIZE=$(stat -c%s "$OUT_PATH")
            echo "Size: $SIZE bytes"

            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "Large file → splitting into 95MB parts"
              # zip split شده داخل پوشه‌ی همین ران
              zip -s 95m "parts/$RUN_DIR/${BASENAME}.zip" "$OUT_PATH"
              # فایل اصلی را حذف می‌کنیم (فقط پارت‌ها بمانند)
              rm "$OUT_PATH"
            else
              echo "Small file → keeping as a single file"
              # فایل کوچک را هم داخل همون پوشه‌ی ران در parts می‌بریم
              mv "$OUT_PATH" "parts/$RUN_DIR/$BASENAME"
            fi

          done <<< "${{ github.event.inputs.file_urls }}"

          echo "All done for $RUN_DIR"
          ls -R parts

      - name: Commit to repo
        id: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # همه خروجی‌ها در parts/ هستند
          git add parts

          # اگر چیزی برای کامیت کردن نیست
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "pushed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git commit -m "Downloaded files (run ${{ github.run_id }})"

          # push را هندل کن، حتی اگر خطا دهد
          if git push; then
            echo "Push succeeded."
            echo "pushed=true" >> $GITHUB_OUTPUT
          else
            echo "Push failed, will use release fallback."
            echo "pushed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release if repo push failed
        if: steps.commit.outputs.pushed != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: download-${{ github.run_id }}
          name: Download ${{ github.run_id }}
          files: |
            parts/**/*
