name: Smart Downloader V4

on:
  workflow_dispatch:
    inputs:
      file_urls:
        description: "لینک‌ها را با فاصله (Space) از هم جدا کنید (حداکثر ۱۰ لینک)"
        required: true

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip p7zip-full

      - name: Prepare folders
        run: |
          mkdir -p downloads
          mkdir -p parts

      - name: Download and process URLs
        env:
          RAW_URLS: ${{ github.event.inputs.file_urls }}
        run: |
          # GitHub به طور پیش‌فرض با -e اجرا می‌کند، اینجا آن را خاموش می‌کنیم
          # تا با خطای یک کامند، کل اسکریپت متوقف نشود.
          set +e
          set -u
          set -f  # غیرفعال کردن globbing مثل * برای امنیت بیشتر

          LIMIT=$((100*1024*1024))   # 100MB
          RUN_DIR="run-${{ github.run_id }}"
          mkdir -p "parts/$RUN_DIR"
          mkdir -p downloads

          echo "Processing URLs for $RUN_DIR"
          COUNT=0
          FAILED=0

          # RAW_URLS بر اساس فاصله (space/tab/newline) به لینک‌های جدا تقسیم می‌شود
          for URL in $RAW_URLS; do
            if [ -z "$URL" ]; then
              continue
            fi

            COUNT=$((COUNT+1))
            if [ "$COUNT" -gt 10 ]; then
              echo "More than 10 URLs supplied, ignoring the rest."
              break
            fi

            echo "----------------------------------------"
            echo "URL #$COUNT: $URL"

            # نام فایل بر اساس URL (بدون query string)
            BASENAME=$(basename "${URL%%\?*}")
            if [ -z "$BASENAME" ] || [ "$BASENAME" = "/" ]; then
              BASENAME="file_$COUNT"
            fi

            OUT_PATH="downloads/$BASENAME"

            # اگر قبلاً فایلی با همین نام دانلود شده بود، یکتا کن
            if [ -e "$OUT_PATH" ]; then
              TS=$(date +%s)
              OUT_PATH="downloads/${TS}_$BASENAME"
              BASENAME=$(basename "$OUT_PATH")
            fi

            echo "Downloading to: $OUT_PATH"

            # دانلود مقاوم؛ اگر خطا داد، لینک بعدی را ادامه بده
            if ! curl -L --retry 10 --retry-delay 5 -C - "$URL" -o "$OUT_PATH"; then
              echo "Download failed for URL #$COUNT ($URL). Skipping."
              FAILED=1
              rm -f "$OUT_PATH"
              continue
            fi

            # خواندن سایز؛ اگر نشد، لینک را رد می‌کنیم
            SIZE=$(stat -c%s "$OUT_PATH" 2>/dev/null)
            if [ -z "$SIZE" ]; then
              echo "Could not determine size for $OUT_PATH. Skipping."
              FAILED=1
              rm -f "$OUT_PATH"
              continue
            fi

            echo "Size: $SIZE bytes"

            TARGET_DIR="parts/$RUN_DIR"
            mkdir -p "$TARGET_DIR"

            # برای هر لینک یک base یکتا بر اساس شماره لینک می‌سازیم
            SAFE_BASE="${COUNT}_$BASENAME"

            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "Large file → splitting into 95MB parts"

              OUT_ZIP="$TARGET_DIR/$SAFE_BASE.zip"

              # اگر به هر دلیلی فایل همنام وجود داشت، اسم یکتا بساز
              idx=1
              while [ -e "$OUT_ZIP" ]; do
                OUT_ZIP="$TARGET_DIR/${SAFE_BASE}_$idx.zip"
                idx=$((idx+1))
              done

              if ! zip -s 95m "$OUT_ZIP" "$OUT_PATH"; then
                echo "zip failed for $OUT_PATH. Skipping this file."
                FAILED=1
                rm -f "$OUT_PATH"
                continue
              fi

              rm -f "$OUT_PATH"
            else
              echo "Small file → keeping as a single file"
              TARGET_PATH="$TARGET_DIR/$SAFE_BASE"
              if ! mv "$OUT_PATH" "$TARGET_PATH"; then
                echo "Failed to move $OUT_PATH to $TARGET_PATH. Skipping."
                FAILED=1
                rm -f "$OUT_PATH"
                continue
              fi
            fi

          done

          echo "----------------------------------------"
          if [ "$COUNT" -eq 0 ]; then
            echo "No URLs provided after parsing input."
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "Finished with some errors. Check logs above."
          else
            echo "All URLs processed successfully."
          fi

          echo "Listing parts directory:"
          ls -R parts || true

      - name: Commit to repo
        id: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add parts

          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "pushed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git commit -m "Downloaded files (run ${{ github.run_id }})"

          if git push; then
            echo "Push succeeded."
            echo "pushed=true" >> $GITHUB_OUTPUT
          else
            echo "Push failed, will use release fallback."
            echo "pushed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release if repo push failed
        if: steps.commit.outputs.pushed != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: download-${{ github.run_id }}
          name: Download ${{ github.run_id }}
          files: |
            parts/**/*
