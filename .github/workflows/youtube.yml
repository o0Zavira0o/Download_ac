name: Fetch YouTube topics

on:
  schedule:
    # هر روز ساعت 8:30 صبح UTC (تقریباً 12 ظهر ایران؛ بسته به ساعت تابستانی)
    - cron: "30 8 * * *"
  workflow_dispatch:  # امکان اجرای دستی

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # برای commit/push لازم است

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Run fetch_videos script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python fetch_videos.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports
          git commit -m "Update YouTube reports [skip ci]" || echo "No changes to commit"
          git push
