name: Fetch Archived Article Links (Foreign Affairs/Policy/New Yorker)

on:
  schedule:
    - cron: '0 * * * *'  # هر ساعت
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4 feedparser lxml

      - name: Run Fetcher Script
        run: python scripts/fetcher_v2.py
        env:
          PYTHONUNBUFFERED: 1

      - name: Commit and Push Archive Links
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # اضافه کردن فایل‌های ضروری (اگر وجود ندارن خطا نده)
          git add articles/ 2>/dev/null || true
          git add log.txt 2>/dev/null || true
          git add processed_urls.txt 2>/dev/null || true
          
          # بررسی وجود تغییرات
          if git status --porcelain | grep -q .; then
            git commit -m "Update article archive links [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
