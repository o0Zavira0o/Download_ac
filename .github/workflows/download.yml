name: Download file to artifact

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'آدرس (URL) فایلی که می‌خواهید دانلود شود'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install --quiet --upgrade requests

      - name: Download file
        id: download
        env:
          INPUT_URL: ${{ github.event.inputs.file_url }}
        run: |
          set -euo pipefail

          mkdir -p download

          python - << 'PY'
          import os
          import re
          import mimetypes
          import pathlib
          from urllib.parse import urlparse

          import requests

          url = os.environ["INPUT_URL"]

          # زمان‌های timeout برای اتصال و خواندن
          timeout = (10, 300)

          with requests.get(url, stream=True, allow_redirects=True, timeout=timeout) as r:
              r.raise_for_status()

              cd = r.headers.get("content-disposition", "") or ""
              filename = None

              # ۱) تلاش برای گرفتن نام فایل از Content-Disposition
              m = re.search(
                  r'filename\*?=(?:UTF-8\'\')?"?([^\";]+)"?',
                  cd,
                  flags=re.IGNORECASE,
              )
              if m:
                  filename = m.group(1).strip().strip('"')

              # ۲) اگر نشد، از انتهای URL (بعد از redirect نهایی) استفاده می‌کنیم
              if not filename:
                  path = urlparse(r.url).path
                  if path and path != "/":
                      filename = pathlib.PurePosixPath(path).name

              # ۳) اگر باز هم چیزی نبود، یک نام پیش‌فرض
              if not filename:
                  filename = "downloaded_file"

              # ۴) اگر پسوند ندارد، از روی Content-Type حدس می‌زنیم
              if "." not in filename.split("/")[-1]:
                  ctype = (r.headers.get("content-type") or "").split(";")[0].strip()
                  if ctype:
                      ext = mimetypes.guess_extension(ctype) or ""
                      if ext and not filename.endswith(ext):
                          filename += ext

              # مسیر ذخیره‌ی فایل با همان نام اصلی
              out_path = pathlib.Path("download") / filename
              out_path.parent.mkdir(parents=True, exist_ok=True)

              # دانلود chunk به chunk برای سرعت و پایداری
              with open(out_path, "wb") as f:
                  for chunk in r.iter_content(chunk_size=1024 * 1024):
                      if chunk:
                          f.write(chunk)

              # --- ساخت نام امن و کوتاه‌شده برای artifact ---
              # کاراکترهای ممنوع در نام آرتیفکت طبق قوانین GitHub
              invalid_for_artifact = '":<>|*?\\/\r\n'
              trans_table = {ord(c): " " for c in invalid_for_artifact}
              artifact_name = filename.translate(trans_table)

              # حذف فاصله‌های اضافی
              artifact_name = re.sub(r"\s+", " ", artifact_name).strip()
              if not artifact_name:
                  artifact_name = "downloaded_file"

              # کوتاه‌کردن نام آرتیفکت تا حداکثر ۲۰۰ کاراکتر (با حفظ پسوند در حد امکان)
              MAX_LEN = 200
              if len(artifact_name) > MAX_LEN:
                  root, ext = os.path.splitext(artifact_name)
                  artifact_name = root[: MAX_LEN - len(ext)] + ext

              print(f"Downloaded to: {out_path}")
              print(f"Artifact name: {artifact_name}")

              # خروجی‌ها برای step بعدی
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  print(f"file_path={out_path}", file=fh)        # مسیر واقعی فایل
                  print(f"file_name={filename}", file=fh)        # نام اصلی فایل
                  print(f"artifact_name={artifact_name}", file=fh)  # نام تمیز و کوتاه‌شده برای آرتیفکت
          PY

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          # از نام تمیزشده به‌عنوان نام آرتیفکت استفاده می‌کنیم
          name: ${{ steps.download.outputs.artifact_name }}
          path: ${{ steps.download.outputs.file_path }}
          if-no-files-found: error
          retention-days: 7
