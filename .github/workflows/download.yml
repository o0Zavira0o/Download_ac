name: Download file to artifact

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'آدرس (URL) فایلی که می‌خواهید دانلود شود'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Download file
        id: download
        env:
          INPUT_URL: ${{ github.event.inputs.file_url }}
        run: |
          set -euo pipefail
          mkdir -p download

          python3 - << 'PY'
          import os
          import re
          import mimetypes
          import pathlib
          from urllib.parse import urlparse
          from urllib.request import Request, urlopen

          url = os.environ["INPUT_URL"]

          # تمیز کردن نام فایل برای استفاده هم در مسیر و هم در نام آرتیفکت
          def sanitize_filename(name: str, max_len: int = 200) -> str:
              # کاراکترهای ممنوع برای GitHub Artifact / فایل‌سیستم
              invalid = '":<>|*?\\/\r\n'
              trans = {ord(c): " " for c in invalid}
              name = name.translate(trans)
              # جمع‌کردن فاصله‌های اضافی
              name = re.sub(r"\s+", " ", name).strip()
              if not name:
                  name = "downloaded_file"

              root, ext = os.path.splitext(name)
              if not root:
                  root = "file"

              # کوتاه‌کردن در صورت خیلی طولانی بودن
              if len(root) + len(ext) > max_len:
                  root = root[: max_len - len(ext)]

              return root + ext

          # دانلود با کتابخانه استاندارد (بدون نیاز به pip install)
          req = Request(url, headers={"User-Agent": "Mozilla/5.0"})
          # timeout کلی (ثانیه)
          with urlopen(req, timeout=300) as resp:
              cd = resp.headers.get("Content-Disposition") or ""
              filename = None

              # ۱) تلاش برای گرفتن نام از Content-Disposition
              m = re.search(
                  r'filename\*?=(?:UTF-8\'\')?"?([^\";]+)"?',
                  cd,
                  flags=re.IGNORECASE,
              )
              if m:
                  filename = m.group(1).strip().strip('"')

              # ۲) اگر نبود، از انتهای URL نهایی بعد از ریدایرکت
              if not filename:
                  path = urlparse(resp.geturl()).path
                  if path and path != "/":
                      filename = pathlib.PurePosixPath(path).name

              # ۳) نام پیش‌فرض
              if not filename:
                  filename = "downloaded_file"

              # ۴) اگر پسوند ندارد، از Content-Type حدس بزن
              if "." not in os.path.basename(filename):
                  ctype = (resp.headers.get("Content-Type") or "").split(";")[0].strip()
                  if ctype:
                      ext = mimetypes.guess_extension(ctype) or ""
                      if ext and not filename.endswith(ext):
                          filename += ext

              # ساخت نام امن برای دیسک و برای نام آرتیفکت
              safe_filename = sanitize_filename(filename)

              out_path = pathlib.Path("download") / safe_filename
              out_path.parent.mkdir(parents=True, exist_ok=True)

              # دانلود تکه‌ای برای سرعت/پایداری
              with open(out_path, "wb") as f:
                  while True:
                      chunk = resp.read(1024 * 1024)
                      if not chunk:
                          break
                      f.write(chunk)

          print(f"Original filename (from server): {filename}")
          print(f"Saved & uploaded as: {safe_filename}")

          github_output = os.environ["GITHUB_OUTPUT"]
          with open(github_output, "a", encoding="utf-8") as fh:
              # مسیر فایلی که باید آپلود شود
              print(f"file_path={out_path}", file=fh)
              # همان نام تمیز‌شده به‌عنوان نام آرتیفکت
              print(f"artifact_name={safe_filename}", file=fh)
          PY

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.download.outputs.artifact_name }}
          path: ${{ steps.download.outputs.file_path }}
          if-no-files-found: error
          retention-days: 7
