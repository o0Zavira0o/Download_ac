name: Smart Downloader to Arvan S3

on:
  workflow_dispatch:
    inputs:
      file_urls:
        description: "لینک‌ها را با فاصله (Space) از هم جدا کنید (حداکثر ۱۰ لینک)"
        required: true
      s3_prefix:
        description: "پیشوند در باکت (مثلاً videos/). برای هر اجرا پوشه run-<id> ساخته می‌شود."
        required: false
        default: "videos/"
      title_prefix:
        description: "پیشوند منطقی عنوان‌ها (فقط برای لاگ؛ روی S3 key تأثیر ندارد)"
        required: false
        default: "Video_"

jobs:
  download_and_upload_arvan:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.ARVAN_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.ARVAN_SECRET_KEY }}
      ENDPOINT: "hot.ir-central1.arvanstorage.ir"    # طبق چیزی که خودت نوشتی
      BUCKET_NAME: "my-github-backup"             # نام باکت آروان
      RUN_ID: ${{ github.run_id }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install boto3
        run: |
          python -m pip install --upgrade pip
          python -m pip install boto3

      - name: Prepare folders
        run: mkdir -p videos

      - name: Download URLs and upload to Arvan S3
        env:
          RAW_URLS: ${{ github.event.inputs.file_urls }}
          S3_PREFIX_INPUT: ${{ github.event.inputs.s3_prefix }}
          TITLE_PREFIX: ${{ github.event.inputs.title_prefix }}
        run: |
          python - << 'PY'
          import os
          import sys
          import time
          import shlex
          import subprocess
          from pathlib import Path
          from urllib.parse import urlparse

          import boto3
          from botocore.config import Config

          # -------- خواندن تنظیمات آروان از env --------
          access_key = os.getenv("AWS_ACCESS_KEY_ID") or ""
          secret_key = os.getenv("AWS_SECRET_ACCESS_KEY") or ""
          endpoint = os.getenv("ENDPOINT") or ""
          bucket = os.getenv("BUCKET_NAME") or ""
          run_id = os.getenv("RUN_ID", "local")

          missing = [name for name, val in [
              ("AWS_ACCESS_KEY_ID", access_key),
              ("AWS_SECRET_ACCESS_KEY", secret_key),
              ("ENDPOINT", endpoint),
              ("BUCKET_NAME", bucket),
          ] if not val]

          if missing:
            print("ERROR: مقادیر زیر تنظیم نشده‌اند:", ", ".join(missing))
            sys.exit(1)

          # اگر پروتکل نداشت، https را اضافه کن
          if not endpoint.startswith("http://") and not endpoint.startswith("https://"):
            endpoint_url = "https://" + endpoint
          else:
            endpoint_url = endpoint

          raw_urls = os.getenv("RAW_URLS", "").strip()
          if not raw_urls:
            print("هیچ URLای در ورودی file_urls داده نشده.")
            sys.exit(0)

          urls = raw_urls.split()
          if len(urls) > 10:
            print(f"{len(urls)} لینک دریافت شد؛ فقط ۱۰ لینک اول پردازش می‌شود.")
            urls = urls[:10]

          s3_prefix_input = os.getenv("S3_PREFIX_INPUT", "").strip()
          if s3_prefix_input and not s3_prefix_input.endswith("/"):
            s3_prefix_input += "/"
          # برای جلوگیری از overwrite، هر اجرا داخل run-<id> می‌رود
          base_prefix = f"{s3_prefix_input}run-{run_id}/"

          title_prefix = os.getenv("TITLE_PREFIX", "Video_")

          videos_dir = Path("videos")
          videos_dir.mkdir(exist_ok=True)

          # -------- ساخت کلاینت S3 (آروان) --------
          print("در حال ساخت کلاینت S3 برای آروان ...")
          session = boto3.session.Session(
              aws_access_key_id=access_key,
              aws_secret_access_key=secret_key,
              region_name="ir-central1",  # برای آروان معمولاً همین region است؛ اگر لازم شد می‌توانی عوضش کنی
          ) 
          s3 = session.client(
              "s3",
              endpoint_url=endpoint_url,
              config=Config(signature_version="s3v4"),
          )

          def extension_from_url(url: str) -> str:
            """
            تلاش برای پیدا کردن پسوند از روی URL. اگر چیزی پیدا نشد، .mp4 برمی‌گرداند.
            """
            path = urlparse(url).path
            name = os.path.basename(path)
            if "." in name:
              ext = "." + name.split(".")[-1]
              if len(ext) <= 6:  # پسوندهای معقول
                return ext
            return ".mp4"

          def download_file(url: str, out_path: Path) -> bool:
            if out_path.exists():
              out_path.unlink()
            cmd = [
              "curl", "-L",
              "--retry", "5", "--retry-delay", "5",
              "--max-time", "1800",
              "--speed-limit", "10240",
              "--speed-time", "300",
              "-C", "-",
              url,
              "-o", str(out_path),
            ]
            print("Downloading with:", " ".join(shlex.quote(c) for c in cmd))
            res = subprocess.run(cmd)
            if res.returncode != 0:
              print(f"دانلود با خطا مواجه شد (exit code {res.returncode}).")
              return False
            try:
              size = out_path.stat().st_size
            except FileNotFoundError:
              print("فایل بعد از دانلود پیدا نشد.")
              return False
            print(f"دانلود انجام شد: {out_path} ({size} bytes)")
            return True

          def upload_to_s3(local_path: Path, key: str):
            print(f"در حال آپلود به آروان: s3://{bucket}/{key}")
            start = time.time()
            s3.upload_file(str(local_path), bucket, key)
            dur = time.time() - start
            print(f"آپلود به آروان تمام شد در {dur:.1f}s")

          for idx, url in enumerate(urls, start=1):
            print("=" * 60)
            print(f"[{time.strftime('%H:%M:%S', time.gmtime())}] START URL #{idx}: {url}")
            start_t = time.time()

            ext = extension_from_url(url)
            logical_title = f"{title_prefix}{idx}"
            local_name = f"{logical_title}{ext}"  # مثال: Video_1.mp4
            local_path = videos_dir / local_name

            if not download_file(url, local_path):
              print(f"دانلود URL #{idx} ناموفق بود، رد می‌شود.")
              continue

            s3_key = f"{base_prefix}{local_name}"  # مثال: videos/run-1234/Video_1.mp4

            try:
              upload_to_s3(local_path, s3_key)
            except Exception as e:
              print(f"آپلود به آروان برای URL #{idx} ناموفق بود:")
              print(e)
            finally:
              if local_path.exists():
                local_path.unlink()

            dur = time.time() - start_t
            print(f"[{time.strftime('%H:%M:%S', time.gmtime())}] DONE URL #{idx} in {dur:.1f}s")

          print("=" * 60)
          print("همه لینک‌ها پردازش شدند.")
          PY
