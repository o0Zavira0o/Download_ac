name: Smart Downloader V6 - Aparat Uploader

on:
  workflow_dispatch:
    inputs:
      file_urls:
        description: "لینک‌ها را با فاصله (Space) از هم جدا کنید (حداکثر ۱۰ لینک)"
        required: true
      category_id:
        description: "شناسه دسته‌بندی آپارات (مثلاً 15 یا 26)"
        required: false
        default: "26"
      title_prefix:
        description: "پیشوند عنوان ویدیوها (Video_ → Video_1, Video_2, ...)"
        required: false
        default: "Video_"

jobs:
  download_and_upload:
    runs-on: ubuntu-latest

    # یوزرنیم و پسورد آپارات از Secrets خوانده می‌شود
    env:
      APARAT_USERNAME: ${{ secrets.APARAT_USERNAME }}
      APARAT_PASSWORD: ${{ secrets.APARAT_PASSWORD }}

    steps:
      # Checkout لازم نیست، چون چیزی به ریپو نمی‌ریزیم

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Aparat SDK
        run: |
          python -m pip install --upgrade pip
          pip install aparat-python

      - name: Prepare folders
        run: mkdir -p downloads

      - name: Download URLs and upload to Aparat
        env:
          RAW_URLS: ${{ github.event.inputs.file_urls }}
          CATEGORY_ID: ${{ github.event.inputs.category_id }}
          TITLE_PREFIX: ${{ github.event.inputs.title_prefix }}
        run: |
          python - << 'PY'
          import os
          import sys
          import time
          import shlex
          import subprocess
          from pathlib import Path
          from urllib.parse import urlparse

          from aparat import Aparat

          username = os.environ.get("APARAT_USERNAME")
          password = os.environ.get("APARAT_PASSWORD")

          if not username or not password:
            print("ERROR: APARAT_USERNAME یا APARAT_PASSWORD به عنوان Secret تنظیم نشده.")
            sys.exit(1)

          raw_urls = os.environ.get("RAW_URLS", "").strip()
          if not raw_urls:
            print("هیچ URLای در ورودی file_urls داده نشده.")
            sys.exit(0)

          urls = raw_urls.split()
          if len(urls) > 10:
            print(f"{len(urls)} لینک دریافت شد؛ فقط ۱۰ لینک اول پردازش می‌شود.")
            urls = urls[:10]

          category_raw = os.environ.get("CATEGORY_ID", "26").strip()
          try:
            category_id = int(category_raw)
          except ValueError:
            print(f"CATEGORY_ID نامعتبر '{category_raw}'، مقدار 26 استفاده می‌شود.")
            category_id = 26

          title_prefix = os.environ.get("TITLE_PREFIX", "Video_")

          downloads_dir = Path("downloads")
          downloads_dir.mkdir(exist_ok=True)

          print("در حال لاگین به آپارات...")
          aparat = Aparat()
          try:
            user = aparat.login(username, password)
          except Exception as e:
            print("Login به آپارات ناموفق بود:")
            print(e)
            sys.exit(1)
          else:
            print(f"با کاربر {getattr(user, 'username', username)} لاگین شد.")

          def safe_filename_from_url(url: str, index: int) -> str:
            parsed = urlparse(url)
            name = os.path.basename(parsed.path)
            if not name or name == "/":
              name = f"video_{index}.mp4"
            if "." not in name:
              name = name + ".mp4"
            return f"{index}_{name}"

          TAGS = ["auto-upload", "github-actions", "import"]

          for idx, url in enumerate(urls, start=1):
            print("=" * 60)
            print(f"[{time.strftime('%H:%M:%S', time.gmtime())}] START URL #{idx}: {url}")
            start = time.time()

            filename = safe_filename_from_url(url, idx)
            out_path = downloads_dir / filename

            if out_path.exists():
              out_path.unlink()

            curl_cmd = [
              "curl", "-L",
              "--retry", "5", "--retry-delay", "5",
              "--max-time", "1200",        # حداکثر ۲۰ دقیقه برای هر لینک
              "--speed-limit", "10240",    # اگر سرعت < 10KB/s
              "--speed-time", "300",       # به مدت ۵ دقیقه → قطع
              "-C", "-",
              url,
              "-o", str(out_path),
            ]
            print("Running:", " ".join(shlex.quote(c) for c in curl_cmd))
            result = subprocess.run(curl_cmd)

            if result.returncode != 0:
              print(f"دانلود URL #{idx} با خطا مواجه شد (exit code {result.returncode}). رد می‌شود.")
              if out_path.exists():
                out_path.unlink()
              continue

            try:
              size = out_path.stat().st_size
            except FileNotFoundError:
              print(f"فایل دانلود شده برای URL #{idx} پیدا نشد. رد می‌شود.")
              continue

            print(f"دانلود انجام شد: {out_path} ({size} bytes)")

            title = f"{title_prefix}{idx}"
            print(f"در حال آپلود به آپارات: title='{title}', category={category_id}")

            try:
              form = aparat.uploadForm(user.username, user.ltoken)
              video = aparat.uploadPost(
                form=form,
                video_path=str(out_path),
                title=title,
                category=category_id,
                tags=TAGS,
                allow_comment=True,
                descreption="",
                video_pass=False,
              )
              print("پاسخ آپارات برای این ویدیو:")
              print(video)
            except Exception as e:
              print(f"آپلود URL #{idx} ناموفق بود:")
              print(e)
            finally:
              if out_path.exists():
                out_path.unlink()

            dur = time.time() - start
            print(f"[{time.strftime('%H:%M:%S', time.gmtime())}] DONE URL #{idx} in {dur:.1f}s")

          print("=" * 60)
          print("همه لینک‌ها پردازش شدند.")
          PY
