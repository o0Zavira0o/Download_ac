name: Smart Downloader V7 - Aparat Direct API

on:
  workflow_dispatch:
    inputs:
      file_urls:
        description: "لینک‌ها را با فاصله (Space) از هم جدا کنید (حداکثر ۱۰ لینک)"
        required: true
      category_id:
        description: "شناسه دسته‌بندی آپارات (مثلاً 15 یا 26)"
        required: false
        default: "26"
      title_prefix:
        description: "پیشوند عنوان ویدیوها (Video_ → Video_1, Video_2, ...)"
        required: false
        default: "Video_"

jobs:
  download_and_upload:
    runs-on: ubuntu-latest

    env:
      APARAT_USERNAME: ${{ secrets.APARAT_USERNAME }}
      APARAT_PASSWORD: ${{ secrets.APARAT_PASSWORD }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Prepare folders
        run: mkdir -p downloads

      - name: Download URLs and upload to Aparat (direct API)
        env:
          RAW_URLS: ${{ github.event.inputs.file_urls }}
          CATEGORY_ID: ${{ github.event.inputs.category_id }}
          TITLE_PREFIX: ${{ github.event.inputs.title_prefix }}
        run: |
          python - << 'PY'
          import os
          import sys
          import time
          import shlex
          import subprocess
          import hashlib
          from pathlib import Path
          from urllib.parse import urlparse, quote

          import requests

          AP_BASE = "https://www.aparat.com/etc/api"

          username = os.environ.get("APARAT_USERNAME")
          password = os.environ.get("APARAT_PASSWORD")

          if not username or not password:
            print("ERROR: APARAT_USERNAME یا APARAT_PASSWORD به عنوان Secret تنظیم نشده.")
            sys.exit(1)

          raw_urls = os.environ.get("RAW_URLS", "").strip()
          if not raw_urls:
            print("هیچ URLای در ورودی file_urls داده نشده.")
            sys.exit(0)

          urls = raw_urls.split()
          if len(urls) > 10:
            print(f"{len(urls)} لینک دریافت شد؛ فقط ۱۰ لینک اول پردازش می‌شود.")
            urls = urls[:10]

          category_raw = os.environ.get("CATEGORY_ID", "26").strip()
          try:
            category_id = int(category_raw)
          except ValueError:
            print(f"CATEGORY_ID نامعتبر '{category_raw}'، مقدار 26 استفاده می‌شود.")
            category_id = 26

          title_prefix = os.environ.get("TITLE_PREFIX", "Video_")

          downloads_dir = Path("downloads")
          downloads_dir.mkdir(exist_ok=True)

          def aparat_login(user: str, pwd: str):
            # lpass = sha1(MD5(password))
            md5 = hashlib.md5(pwd.encode("utf-8")).hexdigest()
            sha = hashlib.sha1(md5.encode("utf-8")).hexdigest()
            url = f"{AP_BASE}/login/luser/{quote(user)}/lpass/{sha}"
            print(f"Login URL: {url}")
            r = requests.get(url, timeout=30)
            r.raise_for_status()
            data = r.json()
            login_info = data.get("login") or data.get("profile") or data.get("user")
            if not login_info:
              raise RuntimeError(f"Login failed, response: {data}")
            if login_info.get("banned") == "yes":
              raise RuntimeError("User is banned according to Aparat response.")
            if "ltoken" not in login_info:
              raise RuntimeError(f"No ltoken in login response: {login_info}")
            return login_info

          def get_upload_form(luser: str, ltoken: str):
            url = f"{AP_BASE}/uploadform/luser/{quote(luser)}/ltoken/{quote(ltoken)}"
            print(f"Requesting upload form: {url}")
            r = requests.get(url, timeout=30)
            r.raise_for_status()
            data = r.json()
            # اولین آبجکت در خروجی را پیدا می‌کنیم
            uf = data.get("uploadform") or data.get("uploadForm")
            if not uf:
              # اگر کلید مشخصی پیدا نشد، از اولین مقدار دیکشنری استفاده می‌کنیم
              if isinstance(data, dict) and data:
                uf = next(iter(data.values()))
            if not uf or "formAction" not in uf:
              raise RuntimeError(f"Invalid uploadform response: {data}")
            form_action = uf.get("formAction") or uf.get("formaction")
            frm_id = uf.get("frm-id") or uf.get("frm_id") or uf.get("frmid")
            if not form_action or not frm_id:
              raise RuntimeError(f"uploadform missing formAction/frm-id: {uf}")
            return {"formAction": form_action, "frm-id": frm_id}

          def upload_video(form, video_path: Path, title: str, category: int, tags, allow_comment=True, description="", video_pass=False):
            form_action = form["formAction"]
            frm_id = form["frm-id"]
            tags_str = "-".join(tags) if tags else ""
            comment = "yes" if allow_comment else "no"
            video_pass_str = "true" if video_pass else "false"

            print(f"POST to {form_action} with frm-id={frm_id}")
            with video_path.open("rb") as f:
              files = {"video": ("video.mp4", f, "video/mp4")}
              data = {
                "frm-id": str(frm_id),
                "data[title]": title,
                "data[category]": str(category),
                "data[tags]": tags_str,
                "data[comment]": comment,
                "data[descr]": description,
                "data[video_pass]": video_pass_str,
              }
              r = requests.post(form_action, data=data, files=files, timeout=1800)
            r.raise_for_status()
            # سرور ممکن است JSON یا متن ساده برگرداند؛ هر دو را هندل می‌کنیم
            try:
              resp = r.json()
            except ValueError:
              resp = r.text
            return resp

          print("در حال لاگین مستقیم به API آپارات...")
          try:
            user_info = aparat_login(username, password)
          except Exception as e:
            print("Login API به آپارات ناموفق بود:")
            print(e)
            sys.exit(1)

          luser = user_info.get("username") or username
          ltoken = user_info["ltoken"]
          print(f"Login OK. username={luser}, ltoken length={len(ltoken)}")

          TAGS = ["auto-upload", "github-actions", "import"]

          def safe_filename_from_url(url: str, index: int) -> str:
            parsed = urlparse(url)
            name = os.path.basename(parsed.path)
            if not name or name == "/":
              name = f"video_{index}.mp4"
            if "." not in name:
              name = name + ".mp4"
            return f"{index}_{name}"

          for idx, url in enumerate(urls, start=1):
            print("=" * 60)
            print(f"[{time.strftime('%H:%M:%S', time.gmtime())}] START URL #{idx}: {url}")
            start = time.time()

            filename = safe_filename_from_url(url, idx)
            out_path = downloads_dir / filename

            if out_path.exists():
              out_path.unlink()

            curl_cmd = [
              "curl", "-L",
              "--retry", "5", "--retry-delay", "5",
              "--max-time", "1200",
              "--speed-limit", "10240",
              "--speed-time", "300",
              "-C", "-",
              url,
              "-o", str(out_path),
            ]
            print("Running:", " ".join(shlex.quote(c) for c in curl_cmd))
            result = subprocess.run(curl_cmd)

            if result.returncode != 0:
              print(f"دانلود URL #{idx} با خطا مواجه شد (exit code {result.returncode}). رد می‌شود.")
              if out_path.exists():
                out_path.unlink()
              continue

            try:
              size = out_path.stat().st_size
            except FileNotFoundError:
              print(f"فایل دانلود شده برای URL #{idx} پیدا نشد. رد می‌شود.")
              continue

            print(f"دانلود انجام شد: {out_path} ({size} bytes)")

            title = f"{title_prefix}{idx}"
            print(f"در حال گرفتن upload form از آپارات برای URL #{idx} ...")
            try:
              form = get_upload_form(luser, ltoken)
            except Exception as e:
              print(f"گرفتن upload form ناموفق بود برای URL #{idx}:")
              print(e)
              out_path.unlink(missing_ok=True)
              continue

            print(f"در حال آپلود به آپارات: title='{title}', category={category_id}")
            try:
              resp = upload_video(
                form=form,
                video_path=out_path,
                title=title,
                category=category_id,
                tags=TAGS,
                allow_comment=True,
                description="",
                video_pass=False,
              )
              print("پاسخ آپارات برای این ویدیو:")
              print(resp)
            except Exception as e:
              print(f"آپلود URL #{idx} ناموفق بود:")
              print(e)
            finally:
              out_path.unlink(missing_ok=True)

            dur = time.time() - start
            print(f"[{time.strftime('%H:%M:%S', time.gmtime())}] DONE URL #{idx} in {dur:.1f}s")

          print("=" * 60)
          print("همه لینک‌ها پردازش شدند.")
          PY
