name: Smart Downloader V11 - Aparat UI (Playwright)

on:
  workflow_dispatch:
    inputs:
      file_urls:
        description: "لینک‌ها را با فاصله (Space) از هم جدا کنید (حداکثر ۱۰ لینک)"
        required: true
      title_prefix:
        description: "پیشوند عنوان‌ها (Video_ → Video_1, Video_2, ...)"
        required: false
        default: "Video_"

jobs:
  download_and_ui_upload:
    runs-on: ubuntu-latest

    env:
      APARAT_USERNAME: ${{ secrets.APARAT_USERNAME }}
      APARAT_PASSWORD: ${{ secrets.APARAT_PASSWORD }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright (Python)
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Prepare folders
        run: mkdir -p downloads

      - name: Download URLs and upload via Aparat UI
        env:
          RAW_URLS: ${{ github.event.inputs.file_urls }}
          TITLE_PREFIX: ${{ github.event.inputs.title_prefix }}
        run: |
          python - << 'PY'
          import os
          import sys
          import time
          import shlex
          import subprocess
          from pathlib import Path
          from urllib.parse import urlparse

          from playwright.sync_api import sync_playwright

          username = os.getenv("APARAT_USERNAME")
          password = os.getenv("APARAT_PASSWORD")

          if not username or not password:
            print("ERROR: APARAT_USERNAME / APARAT_PASSWORD تنظیم نشده.")
            sys.exit(1)

          raw_urls = os.environ.get("RAW_URLS", "").strip()
          if not raw_urls:
            print("هیچ URLای در ورودی file_urls داده نشده.")
            sys.exit(0)

          urls = raw_urls.split()
          if len(urls) > 10:
            print(f"{len(urls)} لینک دریافت شد؛ فقط ۱۰ لینک اول پردازش می‌شود.")
            urls = urls[:10]

          title_prefix = os.environ.get("TITLE_PREFIX", "Video_")

          downloads_dir = Path("downloads")
          downloads_dir.mkdir(exist_ok=True)

          SIGNIN_URL = "https://www.aparat.com/signin"
          UPLOAD_URL = "https://www.aparat.com/reactupload"

          # ------------------ SELECTORS ------------------
          SELECTORS = {
              # صفحه لاگین
              "login_username": "#username",
              "login_continue_username": "button.btn.btn-green.mt-12",
              "login_password": "#password",
              "login_continue_password": "button.btn.btn-green.mt-12.full-width-in-mobile",

              # صفحه آپلود
              "file_input": "#addFile input[type='file']",
              "title_input": "#video-title",

              "category_dropdown": "#FField_category > div > div > div",
              "category_option_tanz": "#FField_category > div > div > div > div > div > div > div > div > div.selectbox-content.fade-enter-done > ul > li:nth-child(4)",

              "tags_container": "#FField_tags",
              "tags_input": "#FField_tags > div > div > div > div > div > div > div > div > div.selectbox-content.fade-enter-done > div > div > div > div > div > div > input",

              "publish_time_dropdown": "#mainContentContainer > main > div.sc-iRFsWr.fevAeF > div > div.sc-icMgfS.fjPXZz.upload-form > div > div.box-content > form > div > div.left.extra-fields > div.sc-jFkwbb.jqsjJa",
              "publish_time_option_save_unpublished": "#FField_publish_date > div > div > div > div > div > div > div > div > div.selectbox-content.fade-enter-done > ul > li:nth-child(3)",

              "final_save_button": "#mainContentContainer > main > div.sc-iRFsWr.fevAeF > div > div.sc-icMgfS.fjPXZz.upload-form > div > div.box-content > form > div > div.form-buttons > button.sc-eFegNN.iQcnte.button",
          }
          # ------------------------------------------------

          def safe_filename_from_url(url: str, index: int) -> str:
            parsed = urlparse(url)
            name = os.path.basename(parsed.path)
            if not name or name == "/":
              name = f"video_{index}.mp4"
            if "." not in name:
              name = name + ".mp4"
            return f"{index}_{name}"

          def download_file(url: str, out_path: Path) -> bool:
            if out_path.exists():
              out_path.unlink()
            cmd = [
              "curl", "-L",
              "--retry", "5", "--retry-delay", "5",
              "--max-time", "1200",
              "--speed-limit", "10240",
              "--speed-time", "300",
              "-C", "-",
              url,
              "-o", str(out_path),
            ]
            print("Downloading with:", " ".join(shlex.quote(c) for c in cmd))
            res = subprocess.run(cmd)
            if res.returncode != 0:
              print(f"دانلود با خطا مواجه شد (exit code {res.returncode}).")
              return False
            try:
              size = out_path.stat().st_size
            except FileNotFoundError:
              print("فایل بعد از دانلود پیدا نشد.")
              return False
            print(f"دانلود انجام شد: {out_path} ({size} bytes)")
            return True

          def login_aparat(page):
            print("رفتن به صفحه لاگین ...")
            page.goto(SIGNIN_URL, wait_until="domcontentloaded")
        
            # دیباگ: ببینیم GitHub واقعاً چه صفحه‌ای را می‌بیند
            try:
                current_url = page.url
                print("بعد از goto، URL فعلی:", current_url)
                html = page.content()
                print("۲٬۰۰۰ کاراکتر اول HTML صفحه لاگین:")
                print(html[:2000])
            except Exception as e:
                print("خطا در خواندن محتوا/URL صفحه لاگین:", e)
        
            # حالا صریحاً منتظر input یوزرنیم می‌مانیم
            try:
                page.wait_for_selector(SELECTORS["login_username"], timeout=60000)
            except Exception as e:
                print("المان username پیدا نشد یا دیر ظاهر شد:", e)
                # اگر به اینجا برسیم یعنی صفحه‌ای که GitHub می‌بیند لاگین معمولی نیست.
                raise
        
            # مرحله ۱: یوزرنیم
            page.fill(SELECTORS["login_username"], username)
            page.click(SELECTORS["login_continue_username"])
            page.wait_for_timeout(2000)
        
            # مرحله ۲: پسورد
            page.wait_for_selector(SELECTORS["login_password"], timeout=60000)
            page.fill(SELECTORS["login_password"], password)
            page.click(SELECTORS["login_continue_password"])
        
            # کمی صبر برای ریدایرکت
            page.wait_for_timeout(5000)
            print("لاگین انجام شد (فرض اولیه؛ اگر نشد، HTML بالا را بررسی می‌کنیم).")
            
          def upload_one(page, video_path: Path, title: str):
            print(f"رفتن به صفحه آپلود: {UPLOAD_URL}")
            page.goto(UPLOAD_URL, wait_until="domcontentloaded")

            # انتخاب فایل
            print(f"انتخاب فایل: {video_path}")
            page.wait_for_selector(SELECTORS["file_input"], timeout=60000)
            page.set_input_files(SELECTORS["file_input"], str(video_path))

            # پر کردن عنوان
            print(f"پر کردن عنوان: {title}")
            page.fill(SELECTORS["title_input"], title)

            # انتخاب دسته‌بندی
            try:
              print("باز کردن منوی دسته‌بندی ...")
              page.click(SELECTORS["category_dropdown"])
              page.wait_for_timeout(1000)
              print("انتخاب گزینه 'طنز و کمدی' ...")
              page.click(SELECTORS["category_option_tanz"])
            except Exception as e:
              print(f"هشدار: انتخاب دسته‌بندی به مشکل خورد: {e} (ادامه می‌دهیم)")

            # وارد کردن برچسب‌ها
            try:
              print("پر کردن برچسب‌ها: FUN,ASMR,RELAX")
              page.click(SELECTORS["tags_container"])
              page.wait_for_selector(SELECTORS["tags_input"], timeout=60000)
              page.fill(SELECTORS["tags_input"], "FUN,ASMR,RELAX")
              page.keyboard.press("Enter")
            except Exception as e:
              print(f"هشدار: پر کردن برچسب‌ها به مشکل خورد: {e} (ادامه می‌دهیم)")

            # تنظیم زمان انتشار → ذخیره و عدم انتشار
            try:
              print("باز کردن منوی زمان انتشار ...")
              page.click(SELECTORS["publish_time_dropdown"])
              page.wait_for_timeout(1000)
              print("انتخاب گزینه 'ذخیره و عدم انتشار' در منوی زمان انتشار ...")
              page.click(SELECTORS["publish_time_option_save_unpublished"])
            except Exception as e:
              print(f"هشدار: انتخاب زمان انتشار به مشکل خورد: {e} (ادامه می‌دهیم)")

            # صبر برای آپلود (۳ دقیقه؛ در صورت نیاز تغییر بده)
            print("صبر برای آپلود (حدود ۳ دقیقه) ...")
            page.wait_for_timeout(180000)

            # کلیک روی دکمه نهایی «ذخیره و عدم انتشار»
            try:
              print("کلیک روی دکمه نهایی 'ذخیره و عدم انتشار' ...")
              page.click(SELECTORS["final_save_button"])
              page.wait_for_timeout(10000)
              print("فرض بر این است که ویدیو ذخیره شده.")
            except Exception as e:
              print(f"هشدار: کلیک روی دکمه نهایی به مشکل خورد: {e}")

          with sync_playwright() as p:
            browser = p.chromium.launch(headless=True)
            context = browser.new_context()
            page = context.new_page()

            login_aparat(page)

            for idx, url in enumerate(urls, start=1):
              print("=" * 60)
              print(f"[{time.strftime('%H:%M:%S', time.gmtime())}] START URL #{idx}: {url}")
              start = time.time()

              filename = safe_filename_from_url(url, idx)
              out_path = downloads_dir / filename

              if not download_file(url, out_path):
                print(f"دانلود URL #{idx} ناموفق بود، رد می‌شود.")
                continue

              title = f"{title_prefix}{idx}"

              try:
                upload_one(page, out_path, title)
              except Exception as e:
                print(f"خطا هنگام آپلود URL #{idx}: {e}")
              finally:
                if out_path.exists():
                  out_path.unlink()

              dur = time.time() - start
              print(f"[{time.strftime('%H:%M:%S', time.gmtime())}] DONE URL #{idx} in {dur:.1f}s")

            browser.close()

          print("=" * 60)
          print("همه لینک‌ها پردازش شدند.")
          PY
