name: Smart Downloader to Arvan S3

on:
  workflow_dispatch:
    inputs:
      file_urls:
        description: "لینک‌ها را با فاصله (Space) از هم جدا کنید (حداکثر ۱۰ لینک)"
        required: true
      s3_prefix:
        description: "پیشوند در باکت (مثلاً videos/). برای هر اجرا پوشه run-<id> ساخته می‌شود."
        required: false
        default: "videos/"
      title_prefix:
        description: "پیشوند منطقی عنوان‌ها (فقط برای لاگ؛ روی S3 key تأثیر ندارد)"
        required: false
        default: "Video_"

jobs:
  download_and_upload_arvan:
    runs-on: ubuntu-latest
    # می‌توانی کم‌وزیادش کنی، ولی برای چند فایل حجیم عدد بالا خوب است
    timeout-minutes: 360

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.ARVAN_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.ARVAN_SECRET_KEY }}
      AWS_EC2_METADATA_DISABLED: "true"        # برای جلوگیری از تاخیرهای بی‌مورد
      ENDPOINT: "hot.ir-central1.arvanstorage.ir"
      BUCKET_NAME: "my-github-backup"
      RUN_ID: ${{ github.run_id }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install boto3
        run: |
          python -m pip install --upgrade pip
          python -m pip install boto3

      - name: Prepare folders
        run: mkdir -p videos

      - name: Download URLs and upload to Arvan S3 (robust)
        env:
          RAW_URLS: ${{ github.event.inputs.file_urls }}
          S3_PREFIX_INPUT: ${{ github.event.inputs.s3_prefix }}
          TITLE_PREFIX: ${{ github.event.inputs.title_prefix }}
        run: |
          python - << 'PY'
          import os
          import sys
          import time
          import shlex
          import subprocess
          from pathlib import Path
          from urllib.parse import urlparse

          import boto3
          from botocore.config import Config as BotoConfig
          from botocore.exceptions import BotoCoreError, ClientError
          from boto3.s3.transfer import TransferConfig

          # ----------------- تنظیمات محیط -----------------
          access_key = os.getenv("AWS_ACCESS_KEY_ID") or ""
          secret_key = os.getenv("AWS_SECRET_ACCESS_KEY") or ""
          endpoint = os.getenv("ENDPOINT") or ""
          bucket = os.getenv("BUCKET_NAME") or ""
          run_id = os.getenv("RUN_ID", "local")

          missing = [name for name, val in [
              ("AWS_ACCESS_KEY_ID", access_key),
              ("AWS_SECRET_ACCESS_KEY", secret_key),
              ("ENDPOINT", endpoint),
              ("BUCKET_NAME", bucket),
          ] if not val]

          if missing:
            print("ERROR: مقادیر زیر تنظیم نشده‌اند:", ", ".join(missing))
            sys.exit(1)

          # اگر پروتکل نداشت، https را اضافه کن
          if not endpoint.startswith("http://") and not endpoint.startswith("https://"):
            endpoint_url = "https://" + endpoint
          else:
            endpoint_url = endpoint

          raw_urls = os.getenv("RAW_URLS", "").strip()
          if not raw_urls:
            print("هیچ URLای در ورودی file_urls داده نشده.")
            sys.exit(0)

          urls = raw_urls.split()
          if len(urls) > 10:
            print(f"{len(urls)} لینک دریافت شد؛ فقط ۱۰ لینک اول پردازش می‌شود.")
            urls = urls[:10]

          s3_prefix_input = os.getenv("S3_PREFIX_INPUT", "").strip()
          if s3_prefix_input and not s3_prefix_input.endswith("/"):
            s3_prefix_input += "/"
          # برای جلوگیری از overwrite، هر اجرا داخل run-<id> می‌رود
          base_prefix = f"{s3_prefix_input}run-{run_id}/"

          title_prefix = os.getenv("TITLE_PREFIX", "Video_")

          videos_dir = Path("videos")
          videos_dir.mkdir(exist_ok=True)

          # ----------------- ساخت کلاینت S3 (آروان) -----------------
          print("در حال ساخت کلاینت S3 برای آروان ...")
          session = boto3.session.Session(
              aws_access_key_id=access_key,
              aws_secret_access_key=secret_key,
              region_name="ir-central1",  # معمول آروان
          )

          # تنظیمات اتصال و retry
          s3_config = BotoConfig(
              signature_version="s3v4",
              retries={
                  "max_attempts": 10,   # تلاش مجدد در سطح request
                  "mode": "standard",
              },
              connect_timeout=60,       # ثانیه
              read_timeout=3600,        # برای partهای بزرگ
              tcp_keepalive=True,
          )

          s3 = session.client(
              "s3",
              endpoint_url=endpoint_url,
              config=s3_config,
          )

          # تنظیمات انتقال چندبخشی (multipart)
          transfer_config = TransferConfig(
              multipart_threshold=64 * 1024 * 1024,   # بالاتر از این سایز، multipart
              multipart_chunksize=64 * 1024 * 1024,   # هر part حدود ۶۴MB
              max_concurrency=8,                      # ۸ اتصال همزمان
              use_threads=True,
          )

          print("کلاینت S3 آماده شد.")

          # ----------------- توابع کمکی -----------------

          def extension_from_url(url: str) -> str:
            """
            تلاش برای پیدا کردن پسوند از روی URL. اگر چیزی پیدا نشد، .mp4 برمی‌گرداند.
            """
            path = urlparse(url).path
            name = os.path.basename(path)
            if "." in name:
              ext = "." + name.split(".")[-1]
              if 0 < len(ext) <= 6:  # پسوندهای معقول
                return ext
            return ".mp4"

          def download_file(url: str, out_path: Path, max_attempts: int = 3) -> bool:
            """
            دانلود با curl به‌همراه retry و timeout.
            """
            for attempt in range(1, max_attempts + 1):
              if out_path.exists():
                out_path.unlink()
              cmd = [
                "curl",
                "-L",                       # دنبال‌کردن ریدایرکت
                "--fail",                   # روی 4xx/5xx خروج با خطا
                "--retry", "5",             # retry داخلی curl روی خطاهای موقت
                "--retry-delay", "5",
                "--max-time", "1800",       # ۳۰ دقیقه برای هر تلاش
                "--speed-limit", "10240",   # اگر سرعت < ۱۰KB/s
                "--speed-time", "300",      # به‌مدت ۵ دقیقه، قطع
                "-C", "-",                  # ادامه دانلود در صورت قطع
                url,
                "-o", str(out_path),
              ]
              print(f"[Download attempt {attempt}/{max_attempts}]")
              print("  Command:", " ".join(shlex.quote(c) for c in cmd))
              res = subprocess.run(cmd)
              if res.returncode != 0:
                print(f"دانلود با خطا مواجه شد (exit code {res.returncode}).")
                if attempt < max_attempts:
                  wait = 10 * attempt
                  print(f"در حال انتظار {wait} ثانیه و تلاش دوباره برای دانلود ...")
                  time.sleep(wait)
                  continue
                else:
                  print("دانلود بعد از چند تلاش ناموفق بود.")
                  return False

              try:
                size = out_path.stat().st_size
              except FileNotFoundError:
                print("فایل بعد از دانلود پیدا نشد.")
                if attempt < max_attempts:
                  print("تلاش مجدد برای دانلود ...")
                  continue
                return False

              print(f"دانلود انجام شد: {out_path} ({size} bytes)")
              return True

            return False

          def upload_to_s3(local_path: Path, key: str, max_attempts: int = 3) -> bool:
            """
            آپلود مطمئن با multipart، retry و بررسی سایز پس از آپلود.
            """
            try:
              file_size = local_path.stat().st_size
            except FileNotFoundError:
              print(f"فایل لوکال برای آپلود پیدا نشد: {local_path}")
              return False

            print(f"هدف آپلود: s3://{bucket}/{key} (سایز لوکال: {file_size} bytes)")

            for attempt in range(1, max_attempts + 1):
              print(f"[Upload attempt {attempt}/{max_attempts}] برای {local_path.name}")
              start = time.time()
              try:
                s3.upload_file(
                    Filename=str(local_path),
                    Bucket=bucket,
                    Key=key,
                    Config=transfer_config,
                    # اگر خواستی ContentType بر اساس پسوند ست کنی، این‌جا ExtraArgs اضافه کن
                    # ExtraArgs={"ContentType": "video/mp4"},
                )
                dur = time.time() - start
                print(f"آپلود به آروان تمام شد در {dur:.1f}s؛ در حال بررسی سایز روی سرور ...")

                # بررسی سایز روی سرور
                head = s3.head_object(Bucket=bucket, Key=key)
                remote_size = head.get("ContentLength")
                if remote_size != file_size:
                  print(f"هشدار: سایز ریموت با لوکال نمی‌خواند! local={file_size}, remote={remote_size}")
                  if attempt < max_attempts:
                    wait = 15 * attempt
                    print(f"تلاش مجدد برای آپلود کامل (انتظار {wait} ثانیه) ...")
                    time.sleep(wait)
                    continue
                  else:
                    print("بعد از چند تلاش، همچنان سایز ناهماهنگ است؛ این فایل مشکل‌دار در نظر گرفته می‌شود.")
                    return False

                print(f"سایز ریموت تأیید شد ({remote_size} bytes). آپلود موفق بود.")
                return True

              except (BotoCoreError, ClientError, Exception) as e:
                dur = time.time() - start
                print(f"خطا در آپلود بعد از {dur:.1f}s:")
                print(repr(e))
                if attempt < max_attempts:
                  wait = 20 * attempt
                  print(f"در حال انتظار {wait} ثانیه و تلاش دوباره برای آپلود ...")
                  time.sleep(wait)
                  continue
                else:
                  print("آپلود بعد از چند تلاش ناموفق بود.")
                  return False

            return False

          # ----------------- پردازش لینک‌ها -----------------
          for idx, url in enumerate(urls, start=1):
            print("=" * 60)
            print(f"[{time.strftime('%H:%M:%S', time.gmtime())}] START URL #{idx}: {url}")
            start_t = time.time()

            ext = extension_from_url(url)
            logical_title = f"{title_prefix}{idx}"
            local_name = f"{logical_title}{ext}"  # مثال: Video_1.mp4
            local_path = videos_dir / local_name

            # --- دانلود ---
            if not download_file(url, local_path):
              print(f"دانلود URL #{idx} ناموفق بود، این لینک رد می‌شود.")
              continue

            # --- آپلود به آروان ---
            s3_key = f"{base_prefix}{local_name}"  # مثال: videos/run-1234/Video_1.mp4

            upload_ok = upload_to_s3(local_path, s3_key)
            if not upload_ok:
              print(f"آپلود آروان برای URL #{idx} در نهایت ناموفق بود. (احتمالاً این فایل ناقص/خراب است)")
            else:
              print(f"آپلود آروان برای URL #{idx} با موفقیت انجام شد.")

            # پاک‌کردن فایل لوکال برای خالی‌شدن دیسک
            try:
              if local_path.exists():
                local_path.unlink()
            except Exception as e:
              print(f"هشدار: نتوانستم فایل لوکال را حذف کنم: {e}")

            dur = time.time() - start_t
            print(f"[{time.strftime('%H:%M:%S', time.gmtime())}] DONE URL #{idx} in {dur:.1f}s")

          print("=" * 60)
          print("همه لینک‌ها پردازش شدند.")
          PY
