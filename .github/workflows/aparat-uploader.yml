name: Smart Downloader V8 - Aparat SDK

on:
  workflow_dispatch:
    inputs:
      file_urls:
        description: "لینک‌ها را با فاصله (Space) از هم جدا کنید (حداکثر ۱۰ لینک)"
        required: true
      category_id:
        description: "شناسه دسته‌بندی آپارات (مثلاً 15 یا 26)"
        required: false
        default: "26"
      title_prefix:
        description: "پیشوند عنوان‌ها (Video_ → Video_1, Video_2, ...)"
        required: false
        default: "Video_"

jobs:
  download_and_upload:
    runs-on: ubuntu-latest

    env:
      APARAT_USERNAME: ${{ secrets.APARAT_USERNAME }}
      APARAT_PASSWORD: ${{ secrets.APARAT_PASSWORD }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Aparat SDK
        run: |
          python -m pip install --upgrade pip
          pip install aparat-python

      - name: Prepare folders
        run: mkdir -p downloads

      - name: Download URLs and upload via aparat-python
        env:
          RAW_URLS: ${{ github.event.inputs.file_urls }}
          CATEGORY_ID: ${{ github.event.inputs.category_id }}
          TITLE_PREFIX: ${{ github.event.inputs.title_prefix }}
        run: |
          python - << 'PY'
          import os
          import sys
          import time
          import shlex
          import subprocess
          from pathlib import Path
          from urllib.parse import urlparse

          from aparat import Aparat

          # یوزرنیم/پسورد را از Secrets می‌خوانیم (دو نام محتمل)
          username = os.getenv("APARAT_USERNAME") or os.getenv("aparat_username")
          password = os.getenv("APARAT_PASSWORD") or os.getenv("aparat_password")

          if not username or not password:
            print("ERROR: هیچ‌کدام از APARAT_USERNAME/APARAT_PASSWORD یا aparat_username/aparat_password تنظیم نشده‌اند.")
            sys.exit(1)

          raw_urls = os.environ.get("RAW_URLS", "").strip()
          if not raw_urls:
            print("هیچ URLای در ورودی file_urls داده نشده.")
            sys.exit(0)

          urls = raw_urls.split()
          if len(urls) > 10:
            print(f"{len(urls)} لینک دریافت شد؛ فقط ۱۰ لینک اول پردازش می‌شود.")
            urls = urls[:10]

          category_raw = os.environ.get("CATEGORY_ID", "26").strip()
          try:
            category_id = int(category_raw)
          except ValueError:
            print(f"CATEGORY_ID نامعتبر '{category_raw}'، مقدار 26 استفاده می‌شود.")
            category_id = 26

          title_prefix = os.environ.get("TITLE_PREFIX", "Video_")

          downloads_dir = Path("downloads")
          downloads_dir.mkdir(exist_ok=True)

          print("در حال لاگین با aparat-python ...")
          aparat = Aparat()
          try:
            login_result = aparat.login(username, password)
          except Exception as e:
            print("Exception هنگام login:")
            print(e)
            sys.exit(1)

          # دیباگ کامل login_result
          print("login_result type:", type(login_result))
          print("login_result repr:", repr(login_result))

          user_obj = None

          # حالت ایده‌آل: همان چیزی که در مثال دیدیم
          if hasattr(login_result, "username") and hasattr(login_result, "ltoken"):
            user_obj = login_result
            print("Using user_obj from login_result (has username & ltoken).")
          # اگر دیکشنری برگردانده
          elif isinstance(login_result, dict):
            cand = None
            for key in ("login", "profile", "user"):
              if key in login_result:
                cand = login_result[key]
                break
            if cand is None:
              cand = login_result
            if isinstance(cand, dict) and "username" in cand and "ltoken" in cand:
              class U: pass
              u = U()
              u.username = cand["username"]
              u.ltoken = cand["ltoken"]
              user_obj = u
              print("Using user_obj built from dict:", cand)

          # اگر خود کلاس Aparat یک property به اسم user داشته باشد
          if user_obj is None and hasattr(aparat, "user"):
            u = getattr(aparat, "user")
            print("aparat.user:", repr(u))
            if hasattr(u, "username") and hasattr(u, "ltoken"):
              user_obj = u
              print("Using user_obj from aparat.user")

          if user_obj is None:
            print("Login موفق به‌نظر نمی‌رسد؛ آبجکت user با username/ltoken پیدا نشد.")
            sys.exit(1)

          print(f"Login OK. username={user_obj.username}, ltoken length={len(user_obj.ltoken)}")

          def safe_filename_from_url(url: str, index: int) -> str:
            parsed = urlparse(url)
            name = os.path.basename(parsed.path)
            if not name or name == "/":
              name = f"video_{index}.mp4"
            if "." not in name:
              name = name + ".mp4"
            return f"{index}_{name}"

          # همان تگ‌های مثال
          TAGS = ['طنز', 'پپانو', 'موسیقی']

          for idx, url in enumerate(urls, start=1):
            print("=" * 60)
            print(f"[{time.strftime('%H:%M:%S', time.gmtime())}] START URL #{idx}: {url}")
            start = time.time()

            filename = safe_filename_from_url(url, idx)
            out_path = downloads_dir / filename
            if out_path.exists():
              out_path.unlink()

            curl_cmd = [
              "curl", "-L",
              "--retry", "5", "--retry-delay", "5",
              "--max-time", "1200",
              "--speed-limit", "10240",
              "--speed-time", "300",
              "-C", "-",
              url,
              "-o", str(out_path),
            ]
            print("Running:", " ".join(shlex.quote(c) for c in curl_cmd))
            result = subprocess.run(curl_cmd)

            if result.returncode != 0:
              print(f"دانلود URL #{idx} با خطا مواجه شد (exit code {result.returncode}). رد می‌شود.")
              if out_path.exists():
                out_path.unlink()
              continue

            try:
              size = out_path.stat().st_size
            except FileNotFoundError:
              print(f"فایل دانلود شده برای URL #{idx} پیدا نشد. رد می‌شود.")
              continue

            print(f"دانلود انجام شد: {out_path} ({size} bytes)")

            title = f"{title_prefix}{idx}"

            try:
              print("ساخت upload form ...")
              form = aparat.uploadForm(user_obj.username, user_obj.ltoken)

              print("در حال آپلود به آپارات با aparat.uploadPost ...")
              # دقیقاً مثل مثالی که دادی:
              video_resp = aparat.uploadPost(
                form=form,
                video_path=str(out_path),
                title=title,
                category=category_id,
                tags=TAGS,
                allow_comment=True,
                video_pass=True,  # مثل مثال؛ در صورت لزوم بعداً می‌توانیم False کنیم
              )
              print("Upload completed, response:")
              print(video_resp)
            except Exception as e:
              print(f"Upload failed for URL #{idx}: {e}")
            finally:
              if out_path.exists():
                out_path.unlink()

            dur = time.time() - start
            print(f"[{time.strftime('%H:%M:%S', time.gmtime())}] DONE URL #{idx} in {dur:.1f}s")

          print("=" * 60)
          print("همه لینک‌ها پردازش شدند.")
          PY
