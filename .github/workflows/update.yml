name: Update Articles

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install requests feedparser

      - name: Prepare log folder
        run: |
          mkdir -p logs
          echo "===== RUN START =====" >> logs/action.log
          date >> logs/action.log

      - name: Run script and capture output
        run: |
          echo "Running script..." >> logs/action.log
          python script.py >> logs/action.log 2>&1 || echo "SCRIPT FAILED" >> logs/action.log

      - name: Save system info
        if: always()
        run: |
          echo "" >> logs/action.log
          echo "===== SYSTEM INFO =====" >> logs/action.log
          python --version >> logs/action.log
          pip list >> logs/action.log

      - name: Commit logs
        if: always()
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add logs/action.log
          git commit -m "update logs" || echo "nothing to commit"
          git push
