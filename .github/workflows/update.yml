name: Journal Bot

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install requests feedparser

      - name: Run script
        run: python script.py

      - name: Commit & Push
        run: |
          git config user.name "journal-bot"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Auto update articles" || echo "No changes"
          git push
