name: Fetch Archived Article Links (Foreign Affairs/Policy/New Yorker)

on:
  schedule:
    - cron: '0 * * * *'  # هر ساعت
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 feedparser lxml

      - name: Run Fetcher Script
        run: python scripts/fetcher_v2.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit and Push Changes
        uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions[bot]
          author_email: github-actions[bot]@users.noreply.github.com
          message: 'Update article archive links [skip ci]'
          add: '.'          # همهٔ تغییرها را اضافه کن (ایمن‌تر از path خاص)
          push: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
